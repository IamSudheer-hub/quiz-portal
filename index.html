<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Portal — Coaching Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="noise"></div>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">QuizPortal</span>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link active">Quizzes</a>
      <a href="result.html" class="nav-link">My Results</a>
      <a href="admin.html" class="nav-link nav-admin">Admin ↗</a>
    </nav>
  </div>
</header>

<main class="main-content">
  <section class="hero">
    <div class="hero-tag">COACHING CENTRE</div>
    <h1 class="hero-title">Take Your<br><em>Quiz</em> Today</h1>
    <p class="hero-sub">Select a quiz below to begin. Keep your Submission ID safe — you'll need it to check results.</p>
  </section>

  <section class="quiz-list-section">
    <div class="section-header">
      <h2 class="section-title">Available Quizzes</h2>
      <div class="section-line"></div>
    </div>
    <!-- Cards are generated automatically from QUIZ_LIST in config.js -->
    <div class="quiz-grid" id="quizGrid"></div>
  </section>
</main>

<footer class="site-footer">
  <p>Powered by Google Sheets + GitHub Pages &mdash; 100% Free</p>
</footer>

<script src="config.js"></script>
<script>
// Auto-build quiz cards from QUIZ_LIST in config.js
const grid = document.getElementById('quizGrid');

if (!QUIZ_LIST || QUIZ_LIST.length === 0) {
  grid.innerHTML = '<p style="color:var(--text-muted);padding:2rem 0">No quizzes added yet. Edit <code>config.js</code> to add quizzes.</p>';
} else {
  QUIZ_LIST.forEach(q => {
    const card = document.createElement('article');
    card.className = 'quiz-card';
    card.dataset.sheetId = q.sheetId;
    const meta = [];
    if (q.date)      meta.push(`📅 ${q.date}`);
    if (q.questions) meta.push(`❓ ${q.questions} Questions`);
    if (q.duration)  meta.push(`⏱ ${q.duration} min`);
    const isOpen = q.open !== false;
    card.innerHTML = `
      <div class="card-subject">${q.subject || 'QUIZ'}</div>
      <h3 class="card-title">${q.name}</h3>
      ${meta.length ? `<div class="card-meta">${meta.map(m=>`<span class="meta-item">${m}</span>`).join('')}</div>` : ''}
      <div class="card-footer">
        <span class="card-badge ${isOpen ? 'badge-open' : 'badge-closed'}">${isOpen ? 'Open' : 'Closed'}</span>
        ${isOpen
          ? `<button class="btn-take" onclick="startQuiz(this)">Take Quiz →</button>`
          : `<span style="font-size:.82rem;color:var(--text-muted);font-weight:600">Not available</span>`}
      </div>`;
    grid.appendChild(card);
  });
}

function startQuiz(btn) {
  const card = btn.closest('.quiz-card');
  const sheetId = card.dataset.sheetId;
  if (!sheetId || sheetId.startsWith('YOUR_')) {
    alert('Please update the sheetId in config.js for this quiz.');
    return;
  }
  window.location.href = `quiz.html?sheetId=${sheetId}`;
}
</script>
</body>
</html>
